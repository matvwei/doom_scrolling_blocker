name: CI and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browser binaries and OS libraries stay on the ephemeral CI runner.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit and component tests
        run: npm test

      - name: Type-check
        run: npm run compile

      - name: Build Chrome extension
        run: npm run build

      - name: Build Edge extension
        run: npm run build:edge

      - name: Run browser E2E tests
        run: xvfb-run -a npm run test:e2e

  release:
    name: Publish GitHub Release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate version, changelog, and unused tag
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "package.json version is not stable SemVer: $version" >&2
            exit 1
          fi
          tag="v$version"
          if ! grep -Fqx "## [$version]" CHANGELOG.md && ! grep -Fqx "## $version" CHANGELOG.md; then
            echo "CHANGELOG.md must contain a heading for $version" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$tag" | grep -q .; then
            echo "Release tag $tag already exists; bump package version before pushing." >&2
            exit 1
          fi
          echo "Validated version $version and unused tag $tag"

      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
